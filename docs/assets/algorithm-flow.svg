<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1210" viewBox="0 0 1200 1210" role="img" aria-labelledby="title description">
<title id="title">Как строится и меняется план</title><desc id="description">Первичный расчёт использует снимки длительности, допустимые пары, CP-SAT и точные поездки. Подбор состава требует подтверждённых людей и проверяет переносы визитов. Событие сохраняет прошлое и перестраивает остаток. Все результаты проходят независимый валидатор.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#F8FAFF"/><stop offset="1" stop-color="#EEF5FC"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#7185A0" stroke-width="2" stroke-linecap="round"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:34px;font-weight:700;fill:#10213B}.sub{font-size:18px;fill:#52647D}.name{font-size:22px;font-weight:700;fill:#17324D}.note{font-size:17px;fill:#52647D}.tag{font-size:14px;font-weight:700;letter-spacing:1px;fill:#2563EB}</style>
<rect width="1200" height="1210" rx="26" fill="url(#bg)"/>
<text x="48" y="48" class="tag">BEEGO! · ТЕХНИЧЕСКАЯ СХЕМА</text>
<text x="48" y="94" class="title">Как строится и меняется план</text><text x="48" y="128" class="sub">Три пути расчёта с общими правилами допустимости</text>
<text x="48" y="180" class="tag">ПЕРВИЧНЫЙ ПЛАН</text>
<g data-card="Входы и длительность"><rect x="48" y="205" width="340" height="140" rx="18" fill="#FFFFFF" stroke="#C8DAF5"/><rect x="48" y="205" width="6" height="140" rx="3" fill="#2563EB"/>
<text x="70" y="245" class="name">Входы и длительность</text>
<text x="70" y="278" class="note">Заявки, состав и точки старта</text>
<text x="70" y="305" class="note">Серверные снимки времени</text>
</g>
<path d="M218 350 L218 368" fill="none" stroke="#7185A0" stroke-width="2.5" marker-end="url(#arrow)"/>
<g data-card="Допустимые пары"><rect x="48" y="377" width="340" height="140" rx="18" fill="#FFFFFF" stroke="#C8DAF5"/><rect x="48" y="377" width="6" height="140" rx="3" fill="#2563EB"/>
<text x="70" y="417" class="name">Допустимые пары</text>
<text x="70" y="450" class="note">Навык, зона, транспорт, оснащение</text>
<text x="70" y="477" class="note">Клиентское окно и смена</text>
</g>
<path d="M218 522 L218 540" fill="none" stroke="#7185A0" stroke-width="2.5" marker-end="url(#arrow)"/>
<g data-card="CP-SAT и уточнение"><rect x="48" y="549" width="340" height="140" rx="18" fill="#FFFFFF" stroke="#C8DAF5"/><rect x="48" y="549" width="6" height="140" rx="3" fill="#2563EB"/>
<text x="70" y="589" class="name">CP-SAT и уточнение</text>
<text x="70" y="622" class="note">Назначения и порядок визитов</text>
<text x="70" y="649" class="note">Детальная дорога и ремонт</text>
</g>
<path d="M218 694 L218 712" fill="none" stroke="#7185A0" stroke-width="2.5" marker-end="url(#arrow)"/>
<g data-card="Последовательный путь"><rect x="48" y="721" width="340" height="140" rx="18" fill="#FFFFFF" stroke="#C8DAF5"/><rect x="48" y="721" width="6" height="140" rx="3" fill="#2563EB"/>
<text x="70" y="761" class="name">Последовательный путь</text>
<text x="70" y="794" class="note">Выезд после предыдущей работы</text>
<text x="70" y="821" class="note">Ожидание и завершение смены</text>
</g>
<path d="M218 868 L218 925" fill="none" stroke="#7185A0" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="430" y="180" class="tag">СОСТАВ ПО РЕЙТИНГУ</text>
<g data-card="Условия качества"><rect x="430" y="205" width="340" height="140" rx="18" fill="#F8F4FF" stroke="#D9CBF1"/><rect x="430" y="205" width="6" height="140" rx="3" fill="#7C3AED"/>
<text x="452" y="245" class="name">Условия качества</text>
<text x="452" y="278" class="note">Диапазон рейтинга и доступный пул</text>
<text x="452" y="305" class="note">Проверенный исходный день</text>
</g>
<path d="M600 350 L600 368" fill="none" stroke="#7185A0" stroke-width="2.5" marker-end="url(#arrow)"/>
<g data-card="Подтверждённые люди"><rect x="430" y="377" width="340" height="140" rx="18" fill="#F8F4FF" stroke="#D9CBF1"/><rect x="430" y="377" width="6" height="140" rx="3" fill="#7C3AED"/>
<text x="452" y="417" class="name">Подтверждённые люди</text>
<text x="452" y="450" class="note">Конкретные инженеры и профили</text>
<text x="452" y="477" class="note">Сверка источника и версии оценок</text>
</g>
<path d="M600 522 L600 540" fill="none" stroke="#7185A0" stroke-width="2.5" marker-end="url(#arrow)"/>
<g data-card="Сокращение состава"><rect x="430" y="549" width="340" height="140" rx="18" fill="#F8F4FF" stroke="#D9CBF1"/><rect x="430" y="549" width="6" height="140" rx="3" fill="#7C3AED"/>
<text x="452" y="589" class="name">Сокращение состава</text>
<text x="452" y="622" class="note">Перенос всех визитов инженера</text>
<text x="452" y="649" class="note">Новые дороги на время отправления</text>
</g>
<path d="M600 694 L600 712" fill="none" stroke="#7185A0" stroke-width="2.5" marker-end="url(#arrow)"/>
<g data-card="Покрытие и качество"><rect x="430" y="721" width="340" height="140" rx="18" fill="#F8F4FF" stroke="#D9CBF1"/><rect x="430" y="721" width="6" height="140" rx="3" fill="#7C3AED"/>
<text x="452" y="761" class="name">Покрытие и качество</text>
<text x="452" y="794" class="note">Утверждённые профили, закрепления</text>
<text x="452" y="821" class="note">Назначения, состав и очередь</text>
</g>
<path d="M600 868 L600 925" fill="none" stroke="#7185A0" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="812" y="180" class="tag">СОБЫТИЕ В СМЕНЕ</text>
<g data-card="Текущее состояние"><rect x="812" y="205" width="340" height="140" rx="18" fill="#F2FBF8" stroke="#B9E0D4"/><rect x="812" y="205" width="6" height="140" rx="3" fill="#0F766E"/>
<text x="834" y="245" class="name">Текущее состояние</text>
<text x="834" y="278" class="note">Событие, время и версия плана</text>
<text x="834" y="305" class="note">Положение и занятость инженера</text>
</g>
<path d="M982 350 L982 368" fill="none" stroke="#7185A0" stroke-width="2.5" marker-end="url(#arrow)"/>
<g data-card="Защищённая часть"><rect x="812" y="377" width="340" height="140" rx="18" fill="#F2FBF8" stroke="#B9E0D4"/><rect x="812" y="377" width="6" height="140" rx="3" fill="#0F766E"/>
<text x="834" y="417" class="name">Защищённая часть</text>
<text x="834" y="450" class="note">Сохранить завершённые визиты</text>
<text x="834" y="477" class="note">Начатая работа завершается</text>
</g>
<path d="M982 522 L982 540" fill="none" stroke="#7185A0" stroke-width="2.5" marker-end="url(#arrow)"/>
<g data-card="Расчёт будущей части"><rect x="812" y="549" width="340" height="140" rx="18" fill="#F2FBF8" stroke="#B9E0D4"/><rect x="812" y="549" width="6" height="140" rx="3" fill="#0F766E"/>
<text x="834" y="589" class="name">Расчёт будущей части</text>
<text x="834" y="622" class="note">Для новой заявки — точная вставка</text>
<text x="834" y="649" class="note">При необходимости — пересборка</text>
</g>
<path d="M982 694 L982 712" fill="none" stroke="#7185A0" stroke-width="2.5" marker-end="url(#arrow)"/>
<g data-card="Выбранное решение"><rect x="812" y="721" width="340" height="140" rx="18" fill="#F2FBF8" stroke="#B9E0D4"/><rect x="812" y="721" width="6" height="140" rx="3" fill="#0F766E"/>
<text x="834" y="761" class="name">Выбранное решение</text>
<text x="834" y="794" class="note">Авария: конкретный специалист</text>
<text x="834" y="821" class="note">Проезд: доступный проверенный путь</text>
</g>
<path d="M982 868 L982 925" fill="none" stroke="#7185A0" stroke-width="2.5" marker-end="url(#arrow)"/>
<g data-card="Независимая проверка всего результата"><rect x="48" y="940" width="1104" height="115" rx="18" fill="#F2FBF8" stroke="#B9E0D4"/><rect x="48" y="940" width="6" height="115" rx="3" fill="#0F766E"/>
<text x="70" y="980" class="name">Независимая проверка всего результата</text>
<text x="70" y="1013" class="note">Входы, длительности, поездки, навыки, склад, окна, смена и сохранность начатого</text>
<text x="70" y="1040" class="note">VALID + EXACT_VALID + publicationAllowed + contentSha256</text>
</g>
<path d="M600 1060 V1076 H313 V1090 M600 1076 H887 V1090" fill="none" stroke="#7185A0" stroke-width="2.5" marker-end="url(#arrow)"/>
<g data-card="Операционная смена"><rect x="48" y="1100" width="530" height="85" rx="18" fill="#FFFFFF" stroke="#C8DAF5"/><rect x="48" y="1100" width="6" height="85" rx="3" fill="#2563EB"/>
<text x="70" y="1140" class="name">Операционная смена</text>
<text x="70" y="1173" class="note">Сравнить черновик → подтвердить публикацию</text>
</g>
<g data-card="Состав и план"><rect x="622" y="1100" width="530" height="85" rx="18" fill="#F8F4FF" stroke="#D9CBF1"/><rect x="622" y="1100" width="6" height="85" rx="3" fill="#7C3AED"/>
<text x="644" y="1140" class="name">Состав и план</text>
<text x="644" y="1173" class="note">Проверенный результат на карте и сохранение сценария</text>
</g>
</svg>
