<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title description">
<title id="title">От данных к управленческому решению</title><desc id="description">Сводки 182 рассчитанных синтетических дней дают историю. Измеренные визиты дают ошибки длительности. Модель спроса даёт диапазон и резерв. Сохранённая смена и ставки дают текущие показатели и PDF. Новый состав проверяется адресным планированием.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#F8FAFF"/><stop offset="1" stop-color="#EEF5FC"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#7185A0" stroke-width="2" stroke-linecap="round"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:34px;font-weight:700;fill:#10213B}.sub{font-size:18px;fill:#52647D}.name{font-size:22px;font-weight:700;fill:#17324D}.note{font-size:17px;fill:#52647D}.tag{font-size:14px;font-weight:700;letter-spacing:1px;fill:#2563EB}</style>
<rect width="1200" height="1040" rx="26" fill="url(#bg)"/>
<text x="48" y="48" class="tag">BEEGO! · ТЕХНИЧЕСКАЯ СХЕМА</text>
<text x="48" y="94" class="title">От данных к управленческому решению</text><text x="48" y="128" class="sub">У каждого показателя есть источник, период и назначение</text>
<g data-card="История дней"><rect x="48" y="170" width="340" height="140" rx="18" fill="#FFFFFF" stroke="#C8DAF5"/><rect x="48" y="170" width="6" height="140" rx="3" fill="#2563EB"/>
<text x="70" y="210" class="name">История дней</text>
<text x="70" y="243" class="note">analytics-history.json</text>
<text x="70" y="270" class="note">182 рассчитанных дня</text>
</g>
<g data-card="Измеренные визиты"><rect x="430" y="170" width="340" height="140" rx="18" fill="#F2FBF8" stroke="#B9E0D4"/><rect x="430" y="170" width="6" height="140" rx="3" fill="#0F766E"/>
<text x="452" y="210" class="name">Измеренные визиты</text>
<text x="452" y="243" class="note">Реестр объектов и этапы работ</text>
<text x="452" y="270" class="note">История и ответы инженеров</text>
</g>
<g data-card="Модель спроса"><rect x="812" y="170" width="340" height="140" rx="18" fill="#F8F4FF" stroke="#D9CBF1"/><rect x="812" y="170" width="6" height="140" rx="3" fill="#7C3AED"/>
<text x="834" y="210" class="name">Модель спроса</text>
<text x="834" y="243" class="note">ml-demand-forecast.json</text>
<text x="834" y="270" class="note">Период обучения и дата прогноза</text>
</g>
<path d="M218 318 L218 354" fill="none" stroke="#7185A0" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M600 318 L600 354" fill="none" stroke="#7185A0" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M982 318 L982 354" fill="none" stroke="#7185A0" stroke-width="2.5" marker-end="url(#arrow)"/>
<g data-card="История и территории"><rect x="48" y="366" width="340" height="155" rx="18" fill="#FFFFFF" stroke="#C8DAF5"/><rect x="48" y="366" width="6" height="155" rx="3" fill="#2563EB"/>
<text x="70" y="406" class="name">История и территории</text>
<text x="70" y="439" class="note">Покрытие, очередь и пробег</text>
<text x="70" y="466" class="note">Сравнение недель, поиск дефицита</text>
<text x="70" y="493" class="note">Переход к дню при наличии архива</text>
</g>
<g data-card="Точность длительности"><rect x="430" y="366" width="340" height="155" rx="18" fill="#F2FBF8" stroke="#B9E0D4"/><rect x="430" y="366" width="6" height="155" rx="3" fill="#0F766E"/>
<text x="452" y="406" class="name">Точность длительности</text>
<text x="452" y="439" class="note">Норматив и адаптивная оценка</text>
<text x="452" y="466" class="note">Ошибка на одной выборке визитов</text>
<text x="452" y="493" class="note">Паспорт и разбор причин</text>
</g>
<g data-card="Прогноз и резерв"><rect x="812" y="366" width="340" height="155" rx="18" fill="#F8F4FF" stroke="#D9CBF1"/><rect x="812" y="366" width="6" height="155" rx="3" fill="#7C3AED"/>
<text x="834" y="406" class="name">Прогноз и резерв</text>
<text x="834" y="439" class="note">Диапазон заявок и временные пики</text>
<text x="834" y="466" class="note">Территории, навыки и состав</text>
<text x="834" y="493" class="note">Резерв для верхнего спроса</text>
</g>
<g data-card="Сохранённая рабочая смена"><rect x="48" y="585" width="530" height="160" rx="18" fill="#FFFFFF" stroke="#C8DAF5"/><rect x="48" y="585" width="6" height="160" rx="3" fill="#2563EB"/>
<text x="70" y="625" class="name">Сохранённая рабочая смена</text>
<text x="70" y="658" class="note">Полные заявки, инженеры, маршруты и факты</text>
<text x="70" y="685" class="note">Версия плана, длительность и транспорт</text>
<text x="70" y="712" class="note">Текущий контрольный день: 17.08.2026</text>
</g>
<g data-card="Показатели и стоимость"><rect x="622" y="585" width="530" height="160" rx="18" fill="#F2FBF8" stroke="#B9E0D4"/><rect x="622" y="585" width="6" height="160" rx="3" fill="#0F766E"/>
<text x="644" y="625" class="name">Показатели и стоимость</text>
<text x="644" y="658" class="note">Смена, ресурсы, таймлайн и сравнение FCFS</text>
<text x="644" y="685" class="note">Часы и пробег × редактируемые ставки</text>
<text x="644" y="712" class="note">PDF воспроизводит выбранную версию</text>
</g>
<path d="M588 665 L611 665" fill="none" stroke="#7185A0" stroke-width="2.5" marker-end="url(#arrow)"/>
<g data-card="Действие: подготовить и проверить новый план"><rect x="48" y="810" width="1104" height="120" rx="18" fill="#FFFCED" stroke="#E8D99D"/><rect x="48" y="810" width="6" height="120" rx="3" fill="#A47A05"/>
<text x="70" y="850" class="name">Действие: подготовить и проверить новый план</text>
<text x="70" y="883" class="note">Резерв, другое окно, перенос визита или добавление ресурса → расчёт → сравнение → публикация</text>
<text x="70" y="910" class="note">Выполнение подтверждается фактами; финансовая оценка использует заданные тарифы</text>
</g>
<text x="48" y="990" class="note">Архив операционного дня нужен для карты и перепланирования; сводок достаточно для графиков.</text>
</svg>
