<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-labelledby="title description">
<title id="title">Как проверяется поездка</title><desc id="description">Локальная Valhalla считает дорогу и пешие подходы. Транспортный индекс сравнивает отправления GTFS и МЦК/МЦД, метро и пересадки с прямым пешим путём. Закрытия проверяются по времени и направлению. Итог влияет на следующее время выезда.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#F8FAFF"/><stop offset="1" stop-color="#EEF5FC"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#7185A0" stroke-width="2" stroke-linecap="round"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:34px;font-weight:700;fill:#10213B}.sub{font-size:18px;fill:#52647D}.name{font-size:22px;font-weight:700;fill:#17324D}.note{font-size:17px;fill:#52647D}.tag{font-size:14px;font-weight:700;letter-spacing:1px;fill:#2563EB}</style>
<rect width="1200" height="1030" rx="26" fill="url(#bg)"/>
<text x="48" y="48" class="tag">BEEGO! · ТЕХНИЧЕСКАЯ СХЕМА</text>
<text x="48" y="94" class="title">Как проверяется поездка</text><text x="48" y="128" class="sub">Время отправления и ограничения действуют на каждом участке</text>
<g data-card="Выезд от текущей точки"><rect x="48" y="170" width="1104" height="105" rx="18" fill="#FFFFFF" stroke="#C8DAF5"/><rect x="48" y="170" width="6" height="105" rx="3" fill="#2563EB"/>
<text x="70" y="210" class="name">Выезд от текущей точки</text>
<text x="70" y="243" class="note">После предыдущей работы или от позиции инженера в пути; транспорт сохраняется</text>
</g>
<path d="M600 283 L600 313" fill="none" stroke="#7185A0" stroke-width="2.5" marker-end="url(#arrow)"/>
<g data-card="Дорога по сети"><rect x="48" y="325" width="530" height="155" rx="18" fill="#FFFFFF" stroke="#C8DAF5"/><rect x="48" y="325" width="6" height="155" rx="3" fill="#2563EB"/>
<text x="70" y="365" class="name">Дорога по сети</text>
<text x="70" y="398" class="note">Автомобиль, велосипед и пеший путь</text>
<text x="70" y="425" class="note">Valhalla на OpenStreetMap</text>
<text x="70" y="452" class="note">Геометрия, минуты и расстояние</text>
</g>
<g data-card="Общественный транспорт"><rect x="622" y="325" width="530" height="155" rx="18" fill="#F8F4FF" stroke="#D9CBF1"/><rect x="622" y="325" width="6" height="155" rx="3" fill="#7C3AED"/>
<text x="644" y="365" class="name">Общественный транспорт</text>
<text x="644" y="398" class="note">Пеший подход + GTFS / МЦК / МЦД / метро</text>
<text x="644" y="425" class="note">Календарь, ожидание, отправления, пересадки</text>
<text x="644" y="452" class="note">Метро: модель ожидания 180 секунд на посадку</text>
</g>
<path d="M313 488 L313 518" fill="none" stroke="#7185A0" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M887 488 L887 518" fill="none" stroke="#7185A0" stroke-width="2.5" marker-end="url(#arrow)"/>
<g data-card="Дорожное ограничение"><rect x="48" y="530" width="530" height="155" rx="18" fill="#FFFCED" stroke="#E8D99D"/><rect x="48" y="530" width="6" height="155" rx="3" fill="#A47A05"/>
<text x="70" y="570" class="name">Дорожное ограничение</text>
<text x="70" y="603" class="note">Направленное ребро и время прохождения</text>
<text x="70" y="630" class="note">Интервал закрытия и разрешённый транспорт</text>
<text x="70" y="657" class="note">Связный доступный объезд</text>
</g>
<g data-card="Ограничение метро"><rect x="622" y="530" width="530" height="155" rx="18" fill="#FFFCED" stroke="#E8D99D"/><rect x="622" y="530" width="6" height="155" rx="3" fill="#A47A05"/>
<text x="644" y="570" class="name">Ограничение метро</text>
<text x="644" y="603" class="note">Перегон, вход или пересадка</text>
<text x="644" y="630" class="note">Часы работы и известное открытие</text>
<text x="644" y="657" class="note">Ожидание и повторная проверка входа</text>
</g>
<path d="M313 693 L313 725" fill="none" stroke="#7185A0" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M887 693 L887 725" fill="none" stroke="#7185A0" stroke-width="2.5" marker-end="url(#arrow)"/>
<g data-card="Выбрать и независимо проверить доступный путь"><rect x="48" y="740" width="1104" height="125" rx="18" fill="#F2FBF8" stroke="#B9E0D4"/><rect x="48" y="740" width="6" height="125" rx="3" fill="#0F766E"/>
<text x="70" y="780" class="name">Выбрать и независимо проверить доступный путь</text>
<text x="70" y="813" class="note">Для короткой поездки сравнить прямой пеший вариант; учесть входы и пересадки</text>
<text x="70" y="840" class="note">Прибытие → ожидание окна → начало работы → длительность → следующий выезд</text>
</g>
<g data-card="Происхождение данных"><rect x="48" y="910" width="1104" height="92" rx="18" fill="#FFFFFF" stroke="#C8DAF5"/><rect x="48" y="910" width="6" height="92" rx="3" fill="#2563EB"/>
<text x="70" y="950" class="name">Происхождение данных</text>
<text x="70" y="983" class="note">Снимки МЦК/МЦД — эталон дня недели; геометрия рельсов может быть схематической</text>
</g>
</svg>
