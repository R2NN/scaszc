<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1070" viewBox="0 0 1200 1070" role="img" aria-labelledby="title description">
<title id="title">Событие → обновлённый план</title><desc id="description">Событие, текущий план и положение инженера определяют будущую часть дня. Новая заявка сначала вставляется в маршруты, затем при необходимости пересобирается остаток. Проверенный черновик публикуется с контролем исходной ревизии. Сетевой контекст подготавливает изменение окна.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#F8FAFF"/><stop offset="1" stop-color="#EEF5FC"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#7185A0" stroke-width="2" stroke-linecap="round"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:34px;font-weight:700;fill:#10213B}.sub{font-size:18px;fill:#52647D}.name{font-size:22px;font-weight:700;fill:#17324D}.note{font-size:17px;fill:#52647D}.tag{font-size:14px;font-weight:700;letter-spacing:1px;fill:#2563EB}</style>
<rect width="1200" height="1070" rx="26" fill="url(#bg)"/>
<text x="48" y="48" class="tag">BEEGO! · ТЕХНИЧЕСКАЯ СХЕМА</text>
<text x="48" y="94" class="title">Событие → обновлённый план</text><text x="48" y="128" class="sub">Текущее положение, сохранность начатого и решение диспетчера</text>
<g data-card="Опубликованный план"><rect x="48" y="170" width="340" height="142" rx="18" fill="#FFFFFF" stroke="#C8DAF5"/><rect x="48" y="170" width="6" height="142" rx="3" fill="#2563EB"/>
<text x="70" y="210" class="name">Опубликованный план</text>
<text x="70" y="243" class="note">Версия, заявки, состав и факты</text>
<text x="70" y="270" class="note">Серверное время смены</text>
</g>
<g data-card="Событие"><rect x="430" y="170" width="340" height="142" rx="18" fill="#FFFCED" stroke="#E8D99D"/><rect x="430" y="170" width="6" height="142" rx="3" fill="#A47A05"/>
<text x="452" y="210" class="name">Событие</text>
<text x="452" y="243" class="note">Авария, отмена, ресурс, окно</text>
<text x="452" y="270" class="note">Длительность, старт или перекрытие</text>
</g>
<g data-card="Текущее положение"><rect x="812" y="170" width="340" height="142" rx="18" fill="#F2FBF8" stroke="#B9E0D4"/><rect x="812" y="170" width="6" height="142" rx="3" fill="#0F766E"/>
<text x="834" y="210" class="name">Текущее положение</text>
<text x="834" y="243" class="note">В пути — допустимая точка выхода</text>
<text x="834" y="270" class="note">На адресе — завершить работу</text>
</g>
<path d="M218 320 L218 353" fill="none" stroke="#7185A0" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M600 320 L600 353" fill="none" stroke="#7185A0" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M982 320 L982 353" fill="none" stroke="#7185A0" stroke-width="2.5" marker-end="url(#arrow)"/>
<g data-card="Сохранить начатое, рассчитать будущую часть"><rect x="48" y="365" width="1104" height="117" rx="18" fill="#F2FBF8" stroke="#B9E0D4"/><rect x="48" y="365" width="6" height="117" rx="3" fill="#0F766E"/>
<text x="70" y="405" class="name">Сохранить начатое, рассчитать будущую часть</text>
<text x="70" y="438" class="note">Для новой заявки: точная вставка → при необходимости пересборка остатка дня</text>
<text x="70" y="465" class="note">Для аварии: выбранный инженер; для проезда: совместные ограничения и доступный обход</text>
</g>
<path d="M600 490 L600 523" fill="none" stroke="#7185A0" stroke-width="2.5" marker-end="url(#arrow)"/>
<g data-card="Проверить результат"><rect x="48" y="535" width="530" height="140" rx="18" fill="#F2FBF8" stroke="#B9E0D4"/><rect x="48" y="535" width="6" height="140" rx="3" fill="#0F766E"/>
<text x="70" y="575" class="name">Проверить результат</text>
<text x="70" y="608" class="note">Независимый валидатор и аудит дороги</text>
<text x="70" y="635" class="note">Весь остаток смены и защищённые факты</text>
</g>
<g data-card="Показать последствия"><rect x="622" y="535" width="530" height="140" rx="18" fill="#FFFFFF" stroke="#C8DAF5"/><rect x="622" y="535" width="6" height="140" rx="3" fill="#2563EB"/>
<text x="644" y="575" class="name">Показать последствия</text>
<text x="644" y="608" class="note">Было → стало: покрытие, время и пробег</text>
<text x="644" y="635" class="note">Передачи, задержки и новые назначения</text>
</g>
<path d="M588 605 L610 605" fill="none" stroke="#7185A0" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M887 684 L887 717" fill="none" stroke="#7185A0" stroke-width="2.5" marker-end="url(#arrow)"/>
<g data-card="Решение диспетчера"><rect x="48" y="730" width="530" height="150" rx="18" fill="#FFFCED" stroke="#E8D99D"/><rect x="48" y="730" width="6" height="150" rx="3" fill="#A47A05"/>
<text x="70" y="770" class="name">Решение диспетчера</text>
<text x="70" y="803" class="note">Уточнить условия, повторить или отменить</text>
<text x="70" y="830" class="note">Подтвердить готовый проверенный вариант</text>
</g>
<g data-card="Публикация"><rect x="622" y="730" width="530" height="150" rx="18" fill="#F2FBF8" stroke="#B9E0D4"/><rect x="622" y="730" width="6" height="150" rx="3" fill="#0F766E"/>
<text x="644" y="770" class="name">Публикация</text>
<text x="644" y="803" class="note">Проверка актуальной базовой ревизии</text>
<text x="644" y="830" class="note">Новая версия; прежний план доступен</text>
</g>
<path d="M588 805 L610 805" fill="none" stroke="#7185A0" stroke-width="2.5" marker-end="url(#arrow)"/>
<g data-card="Сетевой контекст: от общей неисправности к действию"><rect x="48" y="935" width="1104" height="95" rx="18" fill="#F8F4FF" stroke="#D9CBF1"/><rect x="48" y="935" width="6" height="95" rx="3" fill="#7C3AED"/>
<text x="70" y="975" class="name">Сетевой контекст: от общей неисправности к действию</text>
<text x="70" y="1008" class="note">Узел и связанные заявки → восстановление / ждать → согласованное окно → этот же расчёт</text>
</g>
</svg>
