<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1270" viewBox="0 0 1200 1270" role="img" aria-labelledby="title description">
<title id="title">Как устроена платформа</title><desc id="description">Браузер через Nginx обращается к Node API. Смена, длительность, рейтинг, аварии, проезд и сеть используют серверные хранилища. Python проверяет план, Valhalla и транспортный индекс рассчитывают дорогу. Geoapify и Yandex AI вызываются сервером.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#F8FAFF"/><stop offset="1" stop-color="#EEF5FC"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#7185A0" stroke-width="2" stroke-linecap="round"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:34px;font-weight:700;fill:#10213B}.sub{font-size:18px;fill:#52647D}.name{font-size:22px;font-weight:700;fill:#17324D}.note{font-size:17px;fill:#52647D}.tag{font-size:14px;font-weight:700;letter-spacing:1px;fill:#2563EB}</style>
<rect width="1200" height="1270" rx="26" fill="url(#bg)"/>
<text x="48" y="48" class="tag">BEEGO! · ТЕХНИЧЕСКАЯ СХЕМА</text>
<text x="48" y="94" class="title">Как устроена платформа</text><text x="48" y="128" class="sub">Одна карта, серверные правила, постоянные данные и проверенный расчёт</text>
<g data-card="Браузер"><rect x="48" y="165" width="340" height="140" rx="18" fill="#FFFFFF" stroke="#C8DAF5"/><rect x="48" y="165" width="6" height="140" rx="3" fill="#2563EB"/>
<text x="70" y="205" class="name">Браузер</text>
<text x="70" y="238" class="note">React / Vite + MapLibre</text>
<text x="70" y="265" class="note">Карта, списки, время и аналитика</text>
</g>
<g data-card="Nginx"><rect x="430" y="165" width="340" height="140" rx="18" fill="#FFFFFF" stroke="#C8DAF5"/><rect x="430" y="165" width="6" height="140" rx="3" fill="#2563EB"/>
<text x="452" y="205" class="name">Nginx</text>
<text x="452" y="238" class="note">Внешний HTTP через Nginx</text>
<text x="452" y="265" class="note">Прокси в приложение на 8787</text>
</g>
<g data-card="Node API"><rect x="812" y="165" width="340" height="140" rx="18" fill="#FFFFFF" stroke="#C8DAF5"/><rect x="812" y="165" width="6" height="140" rx="3" fill="#2563EB"/>
<text x="834" y="205" class="name">Node API</text>
<text x="834" y="238" class="note">Операции, ревизии и проверки</text>
<text x="834" y="265" class="note">Один общий слот расчёта</text>
</g>
<path d="M393 235 L420 235" fill="none" stroke="#7185A0" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M775 235 L802 235" fill="none" stroke="#7185A0" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="48" y="355" class="tag">СЕРВЕРНЫЕ КОНТУРЫ</text>
<g data-card="Рабочая смена"><rect x="48" y="380" width="340" height="145" rx="18" fill="#FFFFFF" stroke="#C8DAF5"/><rect x="48" y="380" width="6" height="145" rx="3" fill="#2563EB"/>
<text x="70" y="420" class="name">Рабочая смена</text>
<text x="70" y="453" class="note">Черновик → проверка → публикация</text>
<text x="70" y="480" class="note">Версии, факты, PDF и AI</text>
</g>
<g data-card="Длительность и паспорт"><rect x="430" y="380" width="340" height="145" rx="18" fill="#F2FBF8" stroke="#B9E0D4"/><rect x="430" y="380" width="6" height="145" rx="3" fill="#0F766E"/>
<text x="452" y="420" class="name">Длительность и паспорт</text>
<text x="452" y="453" class="note">Норматив + объём + история</text>
<text x="452" y="480" class="note">Ответ инженера → условие</text>
</g>
<g data-card="Рейтинг и состав"><rect x="812" y="380" width="340" height="145" rx="18" fill="#F8F4FF" stroke="#D9CBF1"/><rect x="812" y="380" width="6" height="145" rx="3" fill="#7C3AED"/>
<text x="834" y="420" class="name">Рейтинг и состав</text>
<text x="834" y="453" class="note">Оценка → разбор → новый рейтинг</text>
<text x="834" y="480" class="note">Предложение → состав → маршруты</text>
</g>
<g data-card="Аварийный выезд"><rect x="48" y="550" width="340" height="145" rx="18" fill="#FFFCED" stroke="#E8D99D"/><rect x="48" y="550" width="6" height="145" rx="3" fill="#A47A05"/>
<text x="70" y="590" class="name">Аварийный выезд</text>
<text x="70" y="623" class="note">Серверные часы и текущая точка</text>
<text x="70" y="650" class="note">Выбор инженера и подтверждение</text>
</g>
<g data-card="Проезд"><rect x="430" y="550" width="340" height="145" rx="18" fill="#F2FBF8" stroke="#B9E0D4"/><rect x="430" y="550" width="6" height="145" rx="3" fill="#0F766E"/>
<text x="452" y="590" class="name">Проезд</text>
<text x="452" y="623" class="note">Дороги, станции, входы, пересадки</text>
<text x="452" y="650" class="note">Ограничение → обход → аудит</text>
</g>
<g data-card="Сетевые зависимости"><rect x="812" y="550" width="340" height="145" rx="18" fill="#F8F4FF" stroke="#D9CBF1"/><rect x="812" y="550" width="6" height="145" rx="3" fill="#7C3AED"/>
<text x="834" y="590" class="name">Сетевые зависимости</text>
<text x="834" y="623" class="note">Узел / линия → связанные заявки</text>
<text x="834" y="650" class="note">Восстановление и решения</text>
</g>
<path d="M982 311 V335 H600 V365" fill="none" stroke="#7185A0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="36" y="370" width="1128" height="337" rx="22" fill="none" stroke="#DCE5F0" stroke-dasharray="5 5"/>
<text x="48" y="743" class="tag">ПОСТОЯННЫЕ ДАННЫЕ</text>
<g data-card="SQLite + WAL"><rect x="48" y="765" width="340" height="145" rx="18" fill="#FFFFFF" stroke="#C8DAF5"/><rect x="48" y="765" width="6" height="145" rx="3" fill="#2563EB"/>
<text x="70" y="805" class="name">SQLite + WAL</text>
<text x="70" y="838" class="note">Планы, отзывы, визиты, решения</text>
<text x="70" y="865" class="note">Транзакции и контроль ревизий</text>
</g>
<g data-card="Расчётные артефакты"><rect x="430" y="765" width="340" height="145" rx="18" fill="#FFFFFF" stroke="#C8DAF5"/><rect x="430" y="765" width="6" height="145" rx="3" fill="#2563EB"/>
<text x="452" y="805" class="name">Расчётные артефакты</text>
<text x="452" y="838" class="note">Входы, SHA-256 и доказательства</text>
<text x="452" y="865" class="note">runtime: runs / replans / cache</text>
</g>
<g data-card="Локальные источники"><rect x="812" y="765" width="340" height="145" rx="18" fill="#FFFFFF" stroke="#C8DAF5"/><rect x="812" y="765" width="6" height="145" rx="3" fill="#2563EB"/>
<text x="834" y="805" class="name">Локальные источники</text>
<text x="834" y="838" class="note">Дороги OSM и транспортный индекс</text>
<text x="834" y="865" class="note">GTFS, МЦК/МЦД, метро</text>
</g>
<path d="M600 700 L600 755" fill="none" stroke="#7185A0" stroke-width="2.5" marker-end="url(#arrow)"/>
<g data-card="Python + независимый валидатор"><rect x="48" y="975" width="530" height="145" rx="18" fill="#F2FBF8" stroke="#B9E0D4"/><rect x="48" y="975" width="6" height="145" rx="3" fill="#0F766E"/>
<text x="70" y="1015" class="name">Python + независимый валидатор</text>
<text x="70" y="1048" class="note">CP-SAT: первичный план; локальный поиск: изменения</text>
<text x="70" y="1075" class="note">Состав и маршруты проверяются по общим правилам</text>
</g>
<g data-card="Valhalla + транспортный индекс"><rect x="622" y="975" width="530" height="145" rx="18" fill="#F2FBF8" stroke="#B9E0D4"/><rect x="622" y="975" width="6" height="145" rx="3" fill="#0F766E"/>
<text x="644" y="1015" class="name">Valhalla + транспортный индекс</text>
<text x="644" y="1048" class="note">Дорога, отправления, подходы, ожидание и пересадки</text>
<text x="644" y="1075" class="note">Точное время выезда для каждого участка</text>
</g>
<path d="M600 920 L600 962" fill="none" stroke="#7185A0" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M588 1045 L611 1045" fill="none" stroke="#7185A0" stroke-width="2.5" marker-end="url(#arrow)"/>
<g data-card="Внешние сервисы вызываются сервером"><rect x="48" y="1160" width="1104" height="95" rx="18" fill="#FFFCED" stroke="#E8D99D"/><rect x="48" y="1160" width="6" height="95" rx="3" fill="#A47A05"/>
<text x="70" y="1200" class="name">Внешние сервисы вызываются сервером</text>
</g>
<text x="72" y="1233" class="note">Geoapify — адреса · Yandex AI Studio — вопросы по смене · ключи — в окружении API</text>
</svg>
